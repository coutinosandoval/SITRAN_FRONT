<div class="dashboard-container">
  <!-- BANNER BIENVENIDA -->
  <div
    class="dashboard-banner welcome-banner"
    style="
      background: linear-gradient(135deg, #1f4e79 0%, #2e75b6 100%);
      border-radius: 12px;
      padding: 3rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    "
  >
    <!-- Logo de fondo decorativo -->
    <div
      style="
        position: absolute;
        right: -20px;
        top: -20px;
        opacity: 0.08;
        font-size: 200px;
        color: white;
        line-height: 1;
      "
    >
      <i class="bi bi-truck"></i>
    </div>

    <div class="welcome-text" style="z-index: 1">
      <h2 style="color: white; font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem">
        ¡SITRAN!
      </h2>
      <p style="color: rgba(255, 255, 255, 0.8); font-size: 1.1rem; margin: 0">
        Sistema de Gestión de Cupones de Combustible — SEGEPLAN · Guatemala
      </p>
    </div>

    <div style="z-index: 1; text-align: center">
      <!-- Espacio reservado para logo de SEGEPLAN -->
      <img src="assets/segeplan.png" alt="SEGEPLAN" style="height: 80px" />
    </div>
  </div>

  <!-- TARJETAS DE ACCESO RÁPIDO -->
  <div
    style="
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    "
  >
    <div
      style="
        background: white;
        border-radius: 10px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border-left: 4px solid #2e75b6;
        text-align: center;
      "
    >
      <i class="bi bi-cart-plus" style="font-size: 2rem; color: #2e75b6"></i>
      <p style="margin: 0.5rem 0 0; font-weight: 600; color: #333">Compra de Cupones</p>
      <small style="color: #999">Módulo Compras</small>
    </div>

    <div
      style="
        background: white;
        border-radius: 10px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border-left: 4px solid #375623;
        text-align: center;
      "
    >
      <i class="bi bi-bookmarks" style="font-size: 2rem; color: #375623"></i>
      <p style="margin: 0.5rem 0 0; font-weight: 600; color: #333">Talonarios</p>
      <small style="color: #999">Módulo Almacen</small>
    </div>

    <div
      style="
        background: white;
        border-radius: 10px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border-left: 4px solid #7b3f00;
        text-align: center;
      "
    >
      <i class="bi bi-receipt" style="font-size: 2rem; color: #7b3f00"></i>
      <p style="margin: 0.5rem 0 0; font-weight: 600; color: #333">Solicitudes de Cupones</p>
      <small style="color: #999">Módulo Delegados</small>
    </div>

    <div
      style="
        background: white;
        border-radius: 10px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        border-left: 4px solid #1f4e79;
        text-align: center;
      "
    >
      <i class="bi bi-bar-chart" style="font-size: 2rem; color: #1f4e79"></i>
      <p style="margin: 0.5rem 0 0; font-weight: 600; color: #333">Reportes</p>
      <small style="color: #999">Módulo Reportes</small>
    </div>
  </div>

  <!-- MENSAJE INFORMATIVO -->
  <div
    style="
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    "
  >
    <i class="bi bi-info-circle-fill" style="font-size: 1.5rem; color: #2e75b6; flex-shrink: 0"></i>
    <div>
      <strong style="color: #1f4e79">Sistema en fase de implementación</strong>
    </div>
  </div>
</div>
