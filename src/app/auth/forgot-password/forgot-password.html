<!-- Pantalla de recuperación de contraseña -->
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background: linear-gradient(135deg, #1F4E79, #2E75B6);">

  <div class="card shadow-lg" style="width: 420px; border-radius: 12px;">

    <!-- Encabezado con logo SITRAN -->
    <div class="card-header text-center py-4"
         style="background: #1F4E79; border-radius: 12px 12px 0 0;">
      <h3 class="text-white mb-0 fw-bold">SITRAN</h3>
      <small class="text-white-50">Recuperar Contraseña</small>
    </div>

    <div class="card-body p-4">

      <!-- Icono y descripción -->
      <div class="text-center mb-4">
        <i class="bi bi-envelope-lock" style="font-size: 3rem; color: #1F4E79;"></i>
        <p class="text-muted mt-2">
          Ingresa tu correo institucional y te enviaremos un enlace para restablecer tu contraseña.
        </p>
      </div>

      <!-- Mensaje de éxito -->
      <div *ngIf="mensajeExito" class="alert alert-success">
        <i class="bi bi-check-circle me-2"></i>{{ mensajeExito }}
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="mensajeError" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ mensajeError }}
      </div>

      <!-- Formulario -->
      <div *ngIf="!mensajeExito">
        <div class="mb-3">
          <label class="form-label fw-semibold">Correo electrónico</label>
          <input type="email" class="form-control"
            [(ngModel)]="correo"
            placeholder="tucorreo@segeplan.gob.gt"
            (keyup.enter)="enviarSolicitud()"/>
        </div>

        <!-- Botón enviar -->
        <button class="btn w-100 text-white py-2 mb-3"
          style="background: #1F4E79;"
          (click)="enviarSolicitud()"
          [disabled]="cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!cargando" class="bi bi-send me-2"></i>
          Enviar enlace
        </button>
      </div>

      <!-- Enlace para volver al login -->
      <div class="text-center">
        <a routerLink="/login" class="text-decoration-none" style="color: #1F4E79;">
          <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
        </a>
      </div>

    </div>
  </div>
</div>
