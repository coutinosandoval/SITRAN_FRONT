<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-brand">
    <img src="/favicon.png" alt="SITRAN" height="32" />
    <span>SITRAN</span>
  </div>

  <!-- Menú -->
  <nav class="sidebar-menu">
    <!-- Dashboard: todos los usuarios autenticados -->
    <a routerLink="/dashboard" routerLinkActive="active" class="menu-item">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>

    <!-- Vehículos: por permiso -->
    <div
      class="menu-group"
      *ngIf="
        tienePermiso('VER_VEHICULOS') ||
        tienePermiso('VER_MANTENIMIENTOS') ||
        tienePermiso('VER_HISTORICO_KM')
      "
    >
      <a class="menu-item menu-toggle collapsed" data-bs-toggle="collapse" href="#menuVehiculos">
        <i class="bi bi-truck"></i>
        <span>Vehículos</span>
        <i class="bi bi-chevron-down ms-auto"></i>
      </a>
      <div class="collapse" id="menuVehiculos">
        <a
          *ngIf="tienePermiso('VER_VEHICULOS')"
          routerLink="/vehiculos"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-truck"></i> Vehículos
        </a>
        <a
          *ngIf="tienePermiso('VER_MANTENIMIENTOS')"
          routerLink="/vehiculos/mantenimientos"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-tools"></i> Mantenimientos
        </a>
        <a
          *ngIf="tienePermiso('VER_HISTORICO_KM')"
          routerLink="/vehiculos/historico-kilometraje"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-speedometer"></i> Histórico Km
        </a>
      </div>
    </div>

    <!-- Pilotos: por permiso -->
    <a
      routerLink="/pilotos"
      routerLinkActive="active"
      class="menu-item"
      *ngIf="tienePermiso('VER_PILOTOS')"
    >
      <i class="bi bi-person-badge"></i>
      <span>Pilotos</span>
    </a>

    <!-- Cupones: por permiso -->
    <div
      class="menu-group"
      *ngIf="tienePermiso('VER_TALONARIOS') || tienePermiso('VER_SOLICITUDES')"
    >
      <a class="menu-item menu-toggle collapsed" data-bs-toggle="collapse" href="#menuCupones">
        <i class="bi bi-fuel-pump"></i>
        <span>Cupones</span>
        <i class="bi bi-chevron-down ms-auto"></i>
      </a>
      <div class="collapse" id="menuCupones">
        <a
          *ngIf="tienePermiso('VER_TALONARIOS') && !tienePermiso('SOLICITAR_CUPONES')"
          routerLink="/cupones/talonarios"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-bookmarks"></i> Talonarios
        </a>
        <a
          *ngIf="tienePermiso('VER_SOLICITUDES')"
          routerLink="/cupones/solicitudes-talonario"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-file-earmark-text"></i> Solicitudes
        </a>
      </div>
    </div>

    <!-- Comisiones: por permiso -->
    <a
      routerLink="/comisiones"
      routerLinkActive="active"
      class="menu-item"
      *ngIf="tienePermiso('VER_COMISIONES')"
    >
      <i class="bi bi-briefcase"></i>
      <span>Comisiones</span>
    </a>

    <!-- Facturas: por permiso -->
    <a
      routerLink="/facturas"
      routerLinkActive="active"
      class="menu-item"
      *ngIf="tienePermiso('VER_FACTURAS')"
    >
      <i class="bi bi-receipt"></i>
      <span>Facturas</span>
    </a>

    <!-- Reportes: por permiso -->
    <div
      class="menu-group"
      *ngIf="
        tienePermiso('VER_REPORTES_VEHICULOS') ||
        tienePermiso('VER_REPORTES_PILOTOS') ||
        tienePermiso('VER_REPORTES_COMISIONES') ||
        tienePermiso('VER_REPORTES_CUPONES')
      "
    >
      <a class="menu-item menu-toggle collapsed" data-bs-toggle="collapse" href="#menuReportes">
        <i class="bi bi-bar-chart"></i>
        <span>Reportes</span>
        <i class="bi bi-chevron-down ms-auto"></i>
      </a>
      <div class="collapse" id="menuReportes">
        <a
          *ngIf="tienePermiso('VER_REPORTES_VEHICULOS')"
          routerLink="/reportes/vehiculos"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-truck"></i> Vehículos
        </a>
        <a
          *ngIf="tienePermiso('VER_REPORTES_PILOTOS')"
          routerLink="/reportes/pilotos"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-person-badge"></i> Pilotos
        </a>
        <a
          *ngIf="tienePermiso('VER_REPORTES_COMISIONES')"
          routerLink="/reportes/comisiones"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-briefcase"></i> Comisiones
        </a>
        <a
          *ngIf="tienePermiso('VER_REPORTES_CUPONES')"
          routerLink="/reportes/cupones"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-fuel-pump"></i> Cupones
        </a>
      </div>
    </div>

    <!-- Catálogos: por permiso -->
    <a
      routerLink="/catalogos"
      routerLinkActive="active"
      class="menu-item"
      *ngIf="tienePermiso('VER_CATALOGOS')"
    >
      <i class="bi bi-collection"></i>
      <span>Catálogos</span>
    </a>

    <!-- Reportes IA: por permiso -->
    <a
      routerLink="/reportes-ia"
      routerLinkActive="active"
      class="menu-item"
      *ngIf="tienePermiso('VER_REPORTES_IA')"
    >
      <i class="bi bi-robot"></i>
      <span>Reportes IA</span>
    </a>

    <!-- Seguridad: por permiso -->
    <div
      class="menu-group"
      *ngIf="tienePermiso('VER_SEGURIDAD_USUARIOS') || tienePermiso('VER_SEGURIDAD_ROLES')"
    >
      <a class="menu-item menu-toggle collapsed" data-bs-toggle="collapse" href="#menuSeguridad">
        <i class="bi bi-shield-lock"></i>
        <span>Seguridad</span>
        <i class="bi bi-chevron-down ms-auto"></i>
      </a>
      <div class="collapse" id="menuSeguridad">
        <a
          *ngIf="tienePermiso('VER_SEGURIDAD_USUARIOS')"
          routerLink="/seguridad/usuarios"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-people"></i> Usuarios
        </a>
        <a
          *ngIf="tienePermiso('VER_SEGURIDAD_ROLES')"
          routerLink="/seguridad/roles"
          routerLinkActive="active"
          class="menu-item submenu-item"
        >
          <i class="bi bi-person-gear"></i> Roles
        </a>
        <a *ngIf="tienePermiso('GESTIONAR_COMPRAS_TALONARIOS')" routerLink="/compras">
          Compra de Cupones
        </a>
      </div>
    </div>
  </nav>

  <!-- Footer usuario -->
  <div class="sidebar-footer">
    <i class="bi bi-person-circle fs-5"></i>
    <div class="sidebar-user">
      <span class="sidebar-user-name">{{ nombreUsuario }}</span>
      <a class="sidebar-logout" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
      </a>
    </div>
  </div>
</aside>
