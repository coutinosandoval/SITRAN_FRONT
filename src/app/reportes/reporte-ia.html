<div class="reporte-ia-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-robot"></i> Asistente de Reportes IA</h4>
  </div>

  <!-- Chat -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <!-- Mensajes -->
      <div
        id="chat-container"
        class="chat-messages p-3"
        style="height: 500px; overflow-y: auto; background: #f8f9fa"
      >
        <div *ngFor="let msg of mensajes" class="mb-3">
          <!-- Mensaje usuario -->
          <div *ngIf="msg.tipo === 'usuario'" class="d-flex justify-content-end">
            <div class="bg-primary text-white rounded p-3" style="max-width: 70%">
              {{ msg.texto }}
            </div>
          </div>

          <!-- Mensaje sistema -->
          <div *ngIf="msg.tipo === 'sistema'" class="d-flex justify-content-start">
            <div style="max-width: 95%">
              <div class="bg-white rounded p-3 shadow-sm border">
                <!-- Spinner de carga -->
                <div *ngIf="msg.cargando" class="d-flex align-items-center gap-2">
                  <div class="spinner-border spinner-border-sm text-primary"></div>
                  <span class="text-muted">Procesando consulta...</span>
                </div>

                <!-- Texto respuesta -->
                <div *ngIf="!msg.cargando">
                  <p class="mb-2" style="white-space: pre-line">
                    <i class="bi bi-robot text-primary me-2"></i>{{ msg.texto }}
                  </p>

                  <!-- Tabla de datos -->
                  <div *ngIf="msg.datos && msg.datos.length > 0" class="mt-3">
                    <div class="table-responsive" style="max-height: 300px; overflow-y: auto">
                      <table class="table table-sm table-hover table-striped mb-0">
                        <thead class="table-dark sticky-top">
                          <tr>
                            <th *ngFor="let col of msg.columnas">{{ col }}</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let fila of msg.datos">
                            <td *ngFor="let col of msg.columnas">{{ fila[col] ?? '—' }}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    <!-- Botón descargar Excel -->
                    <div class="mt-2">
                      <button class="btn btn-success btn-sm" (click)="descargarExcel(msg)">
                        <i class="bi bi-file-earmark-excel"></i> Descargar Excel
                      </button>
                      <span class="text-muted small ms-2">{{ msg.datos.length }} registros</span>
                    </div>
                  </div>

                  <!-- Sin resultados -->
                  <div *ngIf="msg.datos && msg.datos.length === 0" class="text-muted small mt-2">
                    <i class="bi bi-info-circle"></i> No se encontraron resultados.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="border-top p-3">
        <div class="d-flex gap-2">
          <textarea
            class="form-control"
            rows="2"
            [(ngModel)]="pregunta"
            (keydown)="teclaEnter($event)"
            placeholder="Escribe tu pregunta... (Enter para enviar)"
            [disabled]="cargando"
          ></textarea>
          <button
            class="btn btn-primary px-4"
            (click)="enviar()"
            [disabled]="cargando || !pregunta.trim()"
          >
            <i class="bi bi-send-fill"></i>
          </button>
        </div>
        <small class="text-muted">Presiona Enter para enviar, Shift+Enter para nueva línea</small>
      </div>
    </div>
  </div>
</div>
