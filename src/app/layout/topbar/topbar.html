<header class="topbar">

  <!-- TÍTULO DE LA PÁGINA -->
  <div class="topbar-left">
    <h1 class="topbar-title">Panel de Control</h1>
    <span class="topbar-date">{{ fechaActual }}</span>
  </div>

  <!-- ACCIONES -->
  <div class="topbar-right">

    <!-- Notificaciones -->
    <div class="topbar-btn" title="Notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot"></span>
    </div>

    <!-- Separador -->
    <div class="topbar-separator"></div>

    <!-- Usuario -->
    <div class="topbar-user">
      <div class="topbar-user-info">
        <span class="topbar-user-name">{{ nombreUsuario }}</span>
        <span class="topbar-user-role">Administrador</span>
      </div>
    </div>

  </div>
</header>
