<div class="login-container">
  <div class="login-card">

    <!-- LOGO -->
    <div class="login-logo">
      <img src="favicon.png" alt="SITRAN" />
    </div>

    <!-- TÍTULO -->
    <div class="login-form-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Inicio de Sesión
    </div>

    <!-- ALERTAS -->
    @if (mensajeError) {
      <div class="alert alert-danger">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ mensajeError }}
      </div>
    }

    @if (mensajeBloqueado) {
      <div class="alert alert-warning">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        {{ mensajeBloqueado }}
      </div>
    }

    <!-- CAMPOS -->
    <div class="form-group">
      <label class="form-label" for="usuario">Usuario</label>
      <input type="text" id="usuario" class="form-control"
             [(ngModel)]="request.usuario"
             placeholder="Ingrese su usuario" autofocus />
    </div>

    <div class="form-group">
      <label class="form-label" for="clave">Contraseña</label>
      <input type="password" id="clave" class="form-control"
             [(ngModel)]="request.clave"
             placeholder="Ingrese su contraseña"
             (keyup.enter)="iniciarSesion()" />
    </div>

    <!-- BOTÓN -->
    <button class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
      @if (cargando) {
        <div class="spinner"></div>
        Verificando...
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Ingresar
      }
    </button>

    <!-- LINKS -->
    <div class="login-links">
      <a href="#" class="login-link">¿Olvidó su contraseña?</a>
      <div class="login-registrar">
        ¿No tiene cuenta? <a href="#">Regístrese aquí</a>
      </div>
    </div>

  </div>
</div>
