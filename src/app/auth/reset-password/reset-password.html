<!-- Pantalla de restablecimiento de contraseña -->
<div
  class="min-vh-100 d-flex align-items-center justify-content-center"
  style="background: linear-gradient(135deg, #1f4e79, #2e75b6)"
>
  <div class="card shadow-lg" style="width: 420px; border-radius: 12px">
    <!-- Encabezado -->
    <div
      class="card-header text-center py-4"
      style="background: #1f4e79; border-radius: 12px 12px 0 0"
    >
      <h3 class="text-white mb-0 fw-bold">SITRAN</h3>
      <small class="text-white-50">Nueva Contraseña</small>
    </div>

    <div class="card-body p-4">
      <!-- Token inválido — no viene token en la URL -->
      <div *ngIf="tokenInvalido" class="text-center">
        <i class="bi bi-x-circle text-danger" style="font-size: 3rem"></i>
        <h5 class="mt-3 text-danger">Enlace inválido</h5>
        <p class="text-muted">Este enlace no es válido o ha expirado.</p>
        <a routerLink="/login" class="btn btn-primary"> Volver al inicio de sesión </a>
      </div>

      <!-- Formulario de nueva contraseña -->
      <div *ngIf="!tokenInvalido">
        <!-- Icono y descripción -->
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock" style="font-size: 3rem; color: #1f4e79"></i>
          <p class="text-muted mt-2">Ingresa tu nueva contraseña.</p>
        </div>

        <!-- Mensaje de éxito -->
        <div *ngIf="mensajeExito" class="alert alert-success text-center">
          <i class="bi bi-check-circle me-2"></i>{{ mensajeExito }}
          <p class="mb-0 mt-2 small">Redirigiendo al inicio de sesión...</p>
        </div>

        <!-- Mensaje de error -->
        <div *ngIf="mensajeError" class="alert alert-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ mensajeError }}
        </div>

        <!-- Formulario -->
        <div *ngIf="!mensajeExito">
          <!-- Nueva contraseña -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Nueva contraseña</label>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="nuevaClave"
              placeholder="Mínimo 6 caracteres"
            />
          </div>

          <!-- Confirmar contraseña -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirmar contraseña</label>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="confirmarClave"
              placeholder="Repite la contraseña"
              (keyup.enter)="cambiarClave()"
            />
          </div>

          <!-- Botón guardar -->
          <button
            class="btn w-100 text-white py-2 mb-3"
            style="background: #1f4e79"
            (click)="cambiarClave()"
            [disabled]="cargando"
          >
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
            <i *ngIf="!cargando" class="bi bi-shield-check me-2"></i>
            Guardar nueva contraseña
          </button>
        </div>

        <!-- Enlace para volver al login -->
        <div class="text-center" *ngIf="!mensajeExito">
          <a routerLink="/login" class="text-decoration-none" style="color: #1f4e79">
            <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
